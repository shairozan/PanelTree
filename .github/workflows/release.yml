name: Release binaries
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  binaries:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and checksum
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          mkdir -p dist
          name="paneltree-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          if [ "$GOOS" = windows ]; then name="${name}.exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$name" ./cmd/paneltree
          cp LICENSE THIRD_PARTY_NOTICES.txt dist/
          (cd dist && sha256sum "$name" > "$name.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: paneltree-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
