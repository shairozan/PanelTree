name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/ ./cmd/paneltree
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/project -run '^$' -fuzz '^FuzzStrictDocument$' -fuzztime=10s -parallel=2
      - run: go test ./internal/layout -run '^$' -fuzz '^FuzzLayoutGeometry$' -fuzztime=10s -parallel=2
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: golangci-lint run
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: paneltree-ci-only
          POSTGRES_DB: paneltree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paneltree"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PANELTREE_TEST_POSTGRES: postgres://postgres:paneltree-ci-only@localhost:5432/paneltree?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/storage ./internal/jobs ./app ./internal/cli ./internal/mcp
