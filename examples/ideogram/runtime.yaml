# API key is read from the host environment, never saved in project artwork.
generation:
  default-profile: story-character
  providers:
    ideogram:
      api-key-env: IDEOGRAM_API_KEY
      concurrency: 2
      timeout: 5m
  profiles:
    story-character:
      renderer: ideogram
      model: ideogram-4-5
      operation: edit
      quality: high
      magic-prompt: off
      size: source
    story-background:
      renderer: ideogram
      model: ideogram-4-5
      operation: generate
      quality: high
      magic-prompt: off
      size: auto
    quick-character:
      renderer: ideogram
      model: ideogram-4-5
      operation: edit
      quality: low
      magic-prompt: off
      size: source
